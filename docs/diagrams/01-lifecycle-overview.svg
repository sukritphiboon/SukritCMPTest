<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" role="img" aria-label="วงจรชีวิตของข้อมูลสำรองบน OceanProtect 6 ช่วง จากเตรียมระบบถึงหมดอายุ พร้อม API หลักของแต่ละช่วง"><title>วงจรชีวิต OceanProtect</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><text x="50" y="34" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold">วงจรชีวิตตามเอกสาร OceanProtect REST (V200R001C32)</text><rect x="50" y="48" width="1300" height="26" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="64" y="66" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ทุกขั้นใช้ร่วมกัน:  POST /v1/auth/token {userName,password}  →  ส่ง header X-Auth-Token (อายุ 24 ชม.)  ที่  https://ip:25081/v1/...</text><rect x="50" y="128" width="190" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="145.0" y="155" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">1 เตรียมระบบ</text><text x="54" y="198" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/host-agent/register</text><text x="54" y="215" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">/v1/environments</text><text x="54" y="232" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">/v1/environments/rescan/{env_id}</text><text x="54" y="249" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">/v1/storage-units</text><line x1="242" y1="150" x2="270" y2="150" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="256.0" y="118" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">resource_id</text><line x1="256.0" y1="122" x2="256.0" y2="147" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="272" y="128" width="190" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="367.0" y="155" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">2 กำหนดการปกป้อง</text><text x="276" y="198" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/slas</text><text x="276" y="215" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  policy_list: full / log /</text><text x="276" y="232" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  incr / snapshot /</text><text x="276" y="249" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  replication / archiving</text><text x="276" y="266" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  + schedule + retention</text><text x="276" y="283" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/protected-objects</text><text x="276" y="300" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  {resource_id, sla_id}</text><line x1="464" y1="150" x2="492" y2="150" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="478.0" y="118" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">sla_id</text><line x1="478.0" y1="122" x2="478.0" y2="147" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="494" y="128" width="190" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="589.0" y="155" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">3 สำรอง</text><text x="498" y="198" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">เครื่องรันตาม SLA เอง</text><text x="498" y="215" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">หรือสั่งมือ:</text><text x="498" y="232" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/protected-objects/</text><text x="498" y="249" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  {resource_id}/action/backup</text><text x="498" y="266" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">GET /v1/jobs/{id}</text><text x="498" y="283" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">PUT /v1/jobs/{id}/action/stop</text><line x1="686" y1="150" x2="714" y2="150" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="700.0" y="118" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">copy</text><line x1="700.0" y1="122" x2="700.0" y2="147" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="716" y="128" width="190" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="811.0" y="155" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">4 สำเนา (copy)</text><text x="720" y="198" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">GET /v1/copies</text><text x="720" y="215" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  chain_id, generation,</text><text x="720" y="232" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  prev/next/parent</text><text x="720" y="249" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  expiration_time, deletable</text><text x="720" y="266" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">แก้อายุเก็บ: update-retention</text><line x1="908" y1="150" x2="936" y2="150" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="922.0" y="118" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">copy_id</text><line x1="922.0" y1="122" x2="922.0" y2="147" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="938" y="128" width="190" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="1033.0" y="155" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">5 ใช้สำเนา</text><text x="942" y="198" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v2/restore/jobs</text><text x="942" y="215" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  CR ปกติ / IR ทันที / FLR ไฟล์</text><text x="942" y="232" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">live mount, replication,</text><text x="942" y="249" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">archive (tape) / recall</text><text x="942" y="266" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/copy/recall</text><line x1="1130" y1="150" x2="1158" y2="150" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="1144.0" y="118" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">ครบอายุ</text><line x1="1144.0" y1="122" x2="1144.0" y2="147" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="1160" y="128" width="190" height="44" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="1255.0" y="155" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">6 หมดอายุ / ลบ</text><text x="1164" y="198" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">งาน COPY_EXPIRE</text><text x="1164" y="215" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  (ถึง expiration_time)</text><text x="1164" y="232" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">งาน COPY_DELETE</text><text x="1164" y="249" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">  (สั่งลบ DELETE copy)</text><rect x="272" y="340" width="1078" height="150" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/><text x="286" y="364" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="start" fill="#1f2937" font-weight="bold">ชั้นความปลอดภัย (คร่อมทุกช่วงตั้งแต่ 2 ถึง 6)</text><rect x="286.0" y="378" width="202.0" height="98" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="294.0" y="398" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">WORM</text><text x="294.0" y="414" font-family="monospace" font-size="10" text-anchor="start" fill="#1f2937">ตั้งใน retention ของ SLA</text><text x="294.0" y="464" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="10.5" text-anchor="start" fill="#6b7280">ล็อกสำเนาไม่ให้ลบก่อนครบกำหนด</text><rect x="498.0" y="378" width="202.0" height="98" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="506.0" y="398" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">Ransomware</text><text x="506.0" y="414" font-family="monospace" font-size="10" text-anchor="start" fill="#1f2937">POST /v1/anti-ransomware/</text><text x="506.0" y="428" font-family="monospace" font-size="10" text-anchor="start" fill="#1f2937">action/detect</text><text x="506.0" y="464" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="10.5" text-anchor="start" fill="#6b7280">สั่งตรวจสำเนา + นโยบายตรวจจับ</text><rect x="710.0" y="378" width="202.0" height="98" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="718.0" y="398" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">Air gap</text><text x="718.0" y="414" font-family="monospace" font-size="10" text-anchor="start" fill="#1f2937">POST /v1/anti-ransomware/</text><text x="718.0" y="428" font-family="monospace" font-size="10" text-anchor="start" fill="#1f2937">airgap/device/change-mode</text><text x="718.0" y="464" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="10.5" text-anchor="start" fill="#6b7280">สลับโหมดอุปกรณ์ในเขตแยกขาด</text><rect x="922.0" y="378" width="202.0" height="98" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="930.0" y="398" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">DR drill</text><text x="930.0" y="414" font-family="monospace" font-size="10" text-anchor="start" fill="#1f2937">GET ผลงาน drill</text><text x="930.0" y="464" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="10.5" text-anchor="start" fill="#6b7280">ซ้อมกู้ภัยแล้วดูผลลัพธ์</text><rect x="1134.0" y="378" width="202.0" height="98" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/><text x="1142.0" y="398" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">Alarm</text><text x="1142.0" y="414" font-family="monospace" font-size="10" text-anchor="start" fill="#1f2937">GET /v1/alarms</text><text x="1142.0" y="464" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="10.5" text-anchor="start" fill="#6b7280">แจ้งเตือนจากเครื่อง</text><rect x="50" y="520" width="1300" height="90" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="64" y="544" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">สิ่งที่ยังไม่ยืนยันจากเอกสาร</text><text x="64" y="564" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">• ช่วง 5: อ่านถึงระดับรายชื่อ interface ของ replication / archive / live mount ยังไม่ได้ไล่ field ทั้งหมด</text><text x="64" y="582" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">• ช่วง 6: ลำดับว่า COPY_EXPIRE ทำงานเมื่อใดและ WORM ขวางการลบอย่างไร เป็นการอนุมานจากชื่อ field และชื่อชนิดงาน</text><text x="64" y="600" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">• ค่า generated_by ของสำเนาและค่า enum สถานะ copy ไม่พบในส่วนที่อ่าน</text></svg>
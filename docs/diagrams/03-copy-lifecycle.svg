<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" role="img" aria-label="ชีวิตของสำเนา: เกิดจากงาน สร้างดัชนี ถูกใช้งานได้หลายแบบ แล้วหมดอายุหรือถูกลบ โดยอายุเก็บแก้ได้ระหว่างทาง"><title>ชีวิตของสำเนา</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="1400" height="520" fill="#ffffff"/><text x="50" y="34" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold">ชีวิตของสำเนา (copy) และสิ่งที่ทำกับมันได้</text><rect x="50" y="70" width="200" height="110" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="150" y="94" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">งานที่สร้างสำเนา</text><text x="150" y="118" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">BACKUP</text><text x="150" y="136" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">copy_replication</text><text x="150" y="154" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">archive_import</text><rect x="330" y="70" width="280" height="110" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="470" y="94" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">สำเนา 1 ชุด  GET /v1/copies</text><text x="470" y="118" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">chain_id, generation</text><text x="470" y="136" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">prev / next / parent (ลูกโซ่)</text><text x="470" y="154" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">expiration_time, deletable</text><line x1="252" y1="125" x2="328" y2="125" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="290" y="115" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">ได้</text><rect x="690" y="70" width="200" height="110" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="790" y="94" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ทำดัชนี</text><text x="790" y="118" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">create-index</text><text x="790" y="138" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">ให้เลือกไฟล์/ช่วงเวลา</text><text x="790" y="156" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">ตอนกู้ได้</text><line x1="612" y1="125" x2="688" y2="125" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="650" y="115" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">แล้ว</text><text x="960" y="62" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">ใช้สำเนาได้ (ไม่ทำให้สำเนาหายเอง — อนุมาน)</text><rect x="960" y="72" width="390" height="26" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="970" y="89" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v2/restore/jobs</text><text x="1130" y="89" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">CR ปกติ / IR ทันที / FLR ไฟล์</text><rect x="960" y="102" width="390" height="26" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="970" y="119" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">live mount</text><text x="1130" y="119" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">เปิดสำเนาขึ้นใช้ชั่วคราว แล้ว unmount</text><rect x="960" y="132" width="390" height="26" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="970" y="149" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">replication</text><text x="1130" y="149" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">คัดลอกไปเครื่องอื่น → ได้สำเนาใหม่</text><rect x="960" y="162" width="390" height="26" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="970" y="179" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">archive / recall</text><text x="1130" y="179" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">เก็บลงเทป แล้ว POST /v1/copy/recall</text><line x1="892" y1="125" x2="958" y2="110" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="330" y="270" width="280" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="470" y="294" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">อายุเก็บ (retention)</text><text x="470" y="318" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">1 = ถาวร   2 = ระบุเวลา</text><text x="470" y="336" font-family="monospace" font-size="11" text-anchor="middle" fill="#1f2937">แก้ภายหลัง: update-retention</text><line x1="470" y1="182" x2="470" y2="268" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="480" y="230" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">กำหนดจาก SLA ตอนสำรอง</text><rect x="50" y="270" width="200" height="90" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="150" y="294" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">WORM</text><text x="150" y="318" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">ตั้งใน retention ของ SLA</text><text x="150" y="336" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">ล็อกไม่ให้ลบ (อนุมาน)</text><line x1="252" y1="315" x2="328" y2="315" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="290" y="305" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">ล็อก</text><rect x="690" y="270" width="250" height="56" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="815" y="294" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="bold">หมดอายุ  งาน COPY_EXPIRE</text><text x="815" y="314" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">เมื่อถึง expiration_time</text><rect x="690" y="346" width="250" height="56" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="815" y="370" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="middle" fill="#1f2937" font-weight="bold">ถูกลบ  งาน COPY_DELETE</text><text x="815" y="390" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">DELETE copy (ต้อง deletable)</text><line x1="612" y1="305" x2="688" y2="298" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><line x1="612" y1="335" x2="688" y2="372" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="1010" y="270" width="340" height="132" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="1024" y="294" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">ที่ยังไม่รู้จากเอกสาร</text><text x="1024" y="316" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">• ค่า enum สถานะของ copy</text><text x="1024" y="336" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">• ค่า generated_by</text><text x="1024" y="356" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">• COPY_EXPIRE ทำงานทันทีหรือรอรอบ</text><text x="1024" y="376" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">• เมื่อ WORM ล็อก DELETE ตอบ error อะไร</text><text x="50" y="440" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#6b7280">ทุกลูกศรเส้นประคืออนุมาน — เอกสารให้แค่รายชื่อ field และชนิดงาน ไม่ได้วาดลำดับ</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 606" width="1400" height="606" role="img" aria-label="ตารางเทียบช่วงของวงจรชีวิตกับสิ่งที่ CMP ทำไว้แล้ว เขียว ใช้ได้ไม่ขึ้นกับ API เหลือง ทำแล้วแต่ต้องเขียน driver ใหม่ เทา ยังไม่มี"><title>CMP เทียบวงจรชีวิต</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="1400" height="606" fill="#ffffff"/><text x="50" y="34" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold">ช่วงของวงจรชีวิต เทียบกับสิ่งที่ CMP ทำไว้แล้ว</text><rect x="50" y="50" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="74" y="63" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ทำแล้ว ไม่ขึ้นกับรูปแบบ API</text><rect x="293" y="50" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="317" y="63" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ทำ/มีเทียบเท่าแล้ว แต่ต้องเขียน driver ใหม่</text><rect x="648" y="50" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="672" y="63" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ยังไม่มีใน CMP</text><text x="60" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">ช่วง</text><text x="330" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">API จริงในเอกสาร</text><text x="640" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">สถานะ</text><text x="760" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">หมายเหตุ</text><line x1="50" y1="100" x2="1350" y2="100" stroke="#9ca3af" stroke-width="1.5"/><rect x="50" y="112" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="133" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">เตรียมระบบ</text><text x="330" y="133" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">host-agent / environments / storage-units</text><text x="640" y="133" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ยังไม่มี</text><text x="760" y="133" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">CMP ผูกเครื่องแค่ระดับ target</text><rect x="50" y="150" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="171" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">SLA</text><text x="330" y="171" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/slas</text><text x="640" y="171" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">มีเทียบเท่า</text><text x="760" y="171" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">policy ของ CMP ≈ SLA แต่เครื่องจริงรันเองตาม SLA — ต้องเขียน driver ใหม่</text><rect x="50" y="188" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="209" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">ผูก resource กับ SLA</text><text x="330" y="209" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/protected-objects</text><text x="640" y="209" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">มีเทียบเท่า</text><text x="760" y="209" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">asset ≈ protected object (resource_id)</text><rect x="50" y="226" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="247" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">สั่งสำรองมือ</text><text x="330" y="247" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">.../{resource_id}/action/backup</text><text x="640" y="247" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ทำแล้ว</text><text x="760" y="247" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">ปลายทางต่างจาก mock — ต้องแก้ driver</text><rect x="50" y="264" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="285" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">ติดตาม / หยุด job</text><text x="330" y="285" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">GET /v1/jobs/{id}, action/stop</text><text x="640" y="285" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ทำแล้ว</text><text x="760" y="285" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">แปลง 11 สถานะ → 6 ของ CMP (ดูภาพ 2)</text><rect x="50" y="302" width="1300" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="60" y="323" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">ตารางเวลา</text><text x="330" y="323" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">อยู่ใน schedule ของ SLA</text><text x="640" y="323" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ทำแล้ว</text><text x="760" y="323" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">APScheduler ฝั่ง CMP ใช้ได้ทุกเครื่อง แต่เครื่องจริงมีตารางเอง ต้องตัดสินใจ</text><rect x="50" y="340" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="361" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">ความจุ / ประสิทธิภาพ / alarm</text><text x="330" y="361" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">GET /v1/alarms ฯลฯ</text><text x="640" y="361" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ทำแล้ว</text><text x="760" y="361" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">สูตร runway และ ratio ใช้ต่อได้ ส่วนดึงข้อมูลต้องแก้</text><rect x="50" y="378" width="1300" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="60" y="399" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Audit / ตรวจสิทธิ์ / เข้ารหัสรหัสผ่าน</text><text x="330" y="399" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">—</text><text x="640" y="399" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ทำแล้ว</text><text x="760" y="399" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">ไม่ขึ้นกับรูปแบบ API ของเครื่อง</text><rect x="50" y="416" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="437" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">สำเนา: ดู / แก้อายุ / ลบ</text><text x="330" y="437" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">/v1/copies</text><text x="640" y="437" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ยังไม่มี</text><text x="760" y="437" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">driver มี list_backup_copies แบบ Dorado เท่านั้น</text><rect x="50" y="454" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="475" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">กู้คืน CR / IR / FLR</text><text x="330" y="475" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v2/restore/jobs</text><text x="640" y="475" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ยังไม่มี</text><text x="760" y="475" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937"></text><rect x="50" y="492" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="513" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Live mount / replication / archive</text><text x="330" y="513" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">หลายหัวข้อ</text><text x="640" y="513" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ยังไม่มี</text><text x="760" y="513" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937"></text><rect x="50" y="530" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="551" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Ransomware / air gap / drill</text><text x="330" y="551" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">/v1/anti-ransomware/...</text><text x="640" y="551" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">ยังไม่มี</text><text x="760" y="551" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937"></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 606" width="1400" height="606" role="img" aria-label="Table of life-cycle stages vs CMP coverage. Green: done, API-independent. Amber: done but needs a new driver. Grey: not in CMP."><title>CMP vs life cycle</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="1400" height="606" fill="#ffffff"/><text x="50" y="34" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold">Life-cycle stages vs what CMP already does</text><rect x="50" y="50" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="74" y="63" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">done, independent of the API dialect</text><rect x="356" y="50" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="380" y="63" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">done / has an equivalent, but needs a new driver</text><rect x="746" y="50" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="770" y="63" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">not in CMP</text><text x="60" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">Stage</text><text x="330" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">API in the reference</text><text x="640" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">Status</text><text x="760" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">Notes</text><line x1="50" y1="100" x2="1350" y2="100" stroke="#9ca3af" stroke-width="1.5"/><rect x="50" y="112" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="133" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Onboarding</text><text x="330" y="133" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">host-agent / environments / storage-units</text><text x="640" y="133" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Missing</text><text x="760" y="133" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">CMP only registers the appliance as a target</text><rect x="50" y="150" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="171" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">SLA</text><text x="330" y="171" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/slas</text><text x="640" y="171" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Equivalent</text><text x="760" y="171" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">CMP policy ~ SLA, but the appliance runs the SLA itself - new driver needed</text><rect x="50" y="188" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="209" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Bind resource to SLA</text><text x="330" y="209" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v1/protected-objects</text><text x="640" y="209" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Equivalent</text><text x="760" y="209" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">asset ~ protected object (resource_id)</text><rect x="50" y="226" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="247" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Manual backup</text><text x="330" y="247" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">.../{resource_id}/action/backup</text><text x="640" y="247" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Done</text><text x="760" y="247" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">Endpoint differs from the mock - driver must change</text><rect x="50" y="264" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="285" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Track / stop a job</text><text x="330" y="285" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">GET /v1/jobs/{id}, action/stop</text><text x="640" y="285" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Done</text><text x="760" y="285" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">11 states -&gt; 6 CMP statuses (see figure 2)</text><rect x="50" y="302" width="1300" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="60" y="323" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Scheduling</text><text x="330" y="323" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">inside the SLA schedule</text><text x="640" y="323" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Done</text><text x="760" y="323" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">CMP APScheduler works anywhere, but the appliance schedules itself - decide which wins</text><rect x="50" y="340" width="1300" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/><text x="60" y="361" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Capacity / performance / alarms</text><text x="330" y="361" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">GET /v1/alarms etc.</text><text x="640" y="361" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Done</text><text x="760" y="361" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">Runway and ratio formulas reusable; data collection must change</text><rect x="50" y="378" width="1300" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="60" y="399" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Audit / auth / credential encryption</text><text x="330" y="399" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">—</text><text x="640" y="399" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Done</text><text x="760" y="399" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">Independent of the appliance API</text><rect x="50" y="416" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="437" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Copies: list / retention / delete</text><text x="330" y="437" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">/v1/copies</text><text x="640" y="437" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Missing</text><text x="760" y="437" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937">driver only has a Dorado-style list_backup_copies</text><rect x="50" y="454" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="475" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Restore CR / IR / FLR</text><text x="330" y="475" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">POST /v2/restore/jobs</text><text x="640" y="475" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Missing</text><text x="760" y="475" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937"></text><rect x="50" y="492" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="513" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Live mount / replication / archive</text><text x="330" y="513" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">several sections</text><text x="640" y="513" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Missing</text><text x="760" y="513" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937"></text><rect x="50" y="530" width="1300" height="32" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="60" y="551" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12.5" text-anchor="start" fill="#1f2937" font-weight="bold">Ransomware / air gap / drill</text><text x="330" y="551" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">/v1/anti-ransomware/...</text><text x="640" y="551" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937">Missing</text><text x="760" y="551" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937"></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" width="1400" height="640" role="img" aria-label="How an API key becomes a role and how the role is checked per route, with the permission table for viewer, operator and admin"><title>RBAC</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><text x="50" y="34" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold">RBAC: from X-API-Key to allow or deny</text><rect x="50" y="70" width="170" height="90" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="135.0" y="94" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Client</text><text x="135.0" y="114" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">header</text><text x="135.0" y="130" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">X-API-Key: &lt;key&gt;</text><rect x="300" y="70" width="250" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="425.0" y="94" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">get_principal</text><text x="425.0" y="114" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">compare_digest vs every key</text><text x="425.0" y="130" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">key -&gt; Principal(user, role)</text><rect x="630" y="70" width="270" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="765.0" y="94" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">authorize (every router)</text><text x="765.0" y="114" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">route template + method</text><text x="765.0" y="130" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">-&gt; required_role</text><rect x="980" y="70" width="170" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1065.0" y="94" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">Endpoint</text><text x="1065.0" y="114" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">runs, audit log</text><text x="1065.0" y="130" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">actor = user</text><line x1="222" y1="115" x2="298" y2="115" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="260" y="105" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">request</text><line x1="552" y1="115" x2="628" y2="115" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="590" y="105" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">Principal</text><line x1="902" y1="115" x2="978" y2="115" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="940" y="105" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">role &gt;= need</text><rect x="300" y="210" width="250" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="425.0" y="234" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">401 Unauthorized</text><text x="425.0" y="254" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">missing or unknown key</text><rect x="630" y="210" width="270" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="765.0" y="234" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">403 Forbidden</text><text x="765.0" y="254" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">role &lt; required role</text><line x1="425" y1="160" x2="425" y2="208" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="435" y="190" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">no match</text><line x1="765" y1="160" x2="765" y2="208" stroke="#1f2937" stroke-width="1.5" marker-end="url(#a)"/><text x="775" y="190" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">role &lt; need</text><rect x="1180" y="70" width="170" height="200" rx="4" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/><text x="1192" y="92" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">Key format</text><text x="1192" y="114" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">user:role:key</text><text x="1192" y="132" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">alice:admin:k1</text><text x="1192" y="150" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">bob:operator:k2</text><text x="1192" y="168" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">carol:viewer:k3</text><text x="1192" y="186" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">user:key = admin</text><text x="1192" y="204" font-family="monospace" font-size="11" text-anchor="start" fill="#1f2937">(old form)</text><text x="50" y="316" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="14" text-anchor="start" fill="#1f2937" font-weight="bold">Who may call what  (role order: viewer &lt; operator &lt; admin)</text><text x="680" y="346" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">viewer</text><text x="840" y="346" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">operator</text><text x="1000" y="346" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">admin</text><rect x="50" y="356" width="540" height="28" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="60" y="368" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937" font-weight="bold">All GET reads: lists, details, overview, alarms, schedule</text><text x="60" y="380" font-family="monospace" font-size="9.5" text-anchor="start" fill="#6b7280">GET ...</text><rect x="620" y="356" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="680" y="375" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="780" y="356" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="840" y="375" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="940" y="356" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="1000" y="375" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="50" y="390" width="540" height="28" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="60" y="402" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937" font-weight="bold">Read the audit log</text><text x="60" y="414" font-family="monospace" font-size="9.5" text-anchor="start" fill="#6b7280">GET /audit-logs</text><rect x="620" y="390" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="680" y="409" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">403</text><rect x="780" y="390" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="840" y="409" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">403</text><rect x="940" y="390" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="1000" y="409" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="50" y="424" width="540" height="28" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="60" y="436" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937" font-weight="bold">Start / cancel a backup job</text><text x="60" y="448" font-family="monospace" font-size="9.5" text-anchor="start" fill="#6b7280">POST /backup-jobs, /{id}/cancel</text><rect x="620" y="424" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="680" y="443" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">403</text><rect x="780" y="424" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="840" y="443" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="940" y="424" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="1000" y="443" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="50" y="458" width="540" height="28" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="60" y="470" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937" font-weight="bold">Run a policy now</text><text x="60" y="482" font-family="monospace" font-size="9.5" text-anchor="start" fill="#6b7280">POST /backup-policies/{id}/run</text><rect x="620" y="458" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="680" y="477" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">403</text><rect x="780" y="458" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="840" y="477" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="940" y="458" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="1000" y="477" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="50" y="492" width="540" height="28" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="60" y="504" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937" font-weight="bold">Acknowledge an alarm</text><text x="60" y="516" font-family="monospace" font-size="9.5" text-anchor="start" fill="#6b7280">POST /oceanprotect/alarms/{id}/acknowledge</text><rect x="620" y="492" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="680" y="511" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">403</text><rect x="780" y="492" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="840" y="511" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="940" y="492" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="1000" y="511" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="50" y="526" width="540" height="28" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="60" y="538" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937" font-weight="bold">Test a target connection</text><text x="60" y="550" font-family="monospace" font-size="9.5" text-anchor="start" fill="#6b7280">POST /targets/{id}/test</text><rect x="620" y="526" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="680" y="545" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">403</text><rect x="780" y="526" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="840" y="545" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="940" y="526" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="1000" y="545" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text><rect x="50" y="560" width="540" height="28" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="60" y="572" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11.5" text-anchor="start" fill="#1f2937" font-weight="bold">Create / change / delete targets, policies, assets</text><text x="60" y="584" font-family="monospace" font-size="9.5" text-anchor="start" fill="#6b7280">POST PATCH DELETE (everything else)</text><rect x="620" y="560" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="680" y="579" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">403</text><rect x="780" y="560" width="120" height="28" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/><text x="840" y="579" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">403</text><rect x="940" y="560" width="120" height="28" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="1000" y="579" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="middle" fill="#1f2937">allowed</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 580" width="1400" height="580" role="img" aria-label="The 11 job states on OceanProtect and the CMP status each maps to. Dashed arrows are inferred; the reference does not draw the order."><title>Job states</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><rect width="1400" height="580" fill="#ffffff"/><text x="50" y="34" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="16" text-anchor="start" fill="#1f2937" font-weight="bold">Job states (GET /v1/jobs/{id}) and the CMP status they map to</text><text x="50" y="54" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#6b7280">The 11 values are copied from the reference. Dashed arrows are inferred - the reference does not draw the transitions.</text><rect x="50" y="250" width="170" height="56" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="135.0" y="274" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">READY</text><text x="135.0" y="294" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: PENDING</text><rect x="290" y="250" width="170" height="56" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="375.0" y="274" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">PENDING</text><text x="375.0" y="294" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: PENDING</text><rect x="530" y="250" width="170" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="615.0" y="274" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">RUNNING</text><text x="615.0" y="294" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: RUNNING</text><line x1="220" y1="278" x2="290" y2="278" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="255" y="268" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">queued</text><line x1="460" y1="278" x2="530" y2="278" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="495" y="268" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">started</text><rect x="850" y="80" width="250" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="975" y="104" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">SUCCESS</text><text x="975" y="124" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: SUCCESS</text><path d="M700,278 C775,278 775,108 848,108" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="850" y="170" width="250" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="975" y="194" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">PARTIAL_SUCCESS</text><text x="975" y="214" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: PARTIALLY_SUCCESSFUL</text><path d="M700,278 C775,278 775,198 848,198" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="850" y="260" width="250" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="975" y="284" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">FAIL</text><text x="975" y="304" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: FAILED</text><path d="M700,278 C775,278 775,288 848,288" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><rect x="850" y="350" width="250" height="56" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="975" y="374" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ABNORMAL</text><text x="975" y="394" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: FAILED</text><path d="M700,278 C775,278 775,378 848,378" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="745" y="150" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">finishes with a result</text><rect x="530" y="440" width="170" height="56" rx="6" fill="#ffffff" stroke="#4b5563" stroke-width="2"/><text x="615.0" y="464" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ABORTING</text><text x="615.0" y="484" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: RUNNING</text><line x1="615" y1="306" x2="615" y2="440" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="625" y="350" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">action/stop</text><rect x="850" y="440" width="250" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="975.0" y="464" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ABORTED</text><text x="975.0" y="484" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: CANCELLED</text><rect x="1140" y="440" width="210" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="1245.0" y="464" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">ABORT_FAILED</text><text x="1245.0" y="484" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: (none - not mapped yet)</text><line x1="700" y1="468" x2="848" y2="468" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="774" y="458" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">stopped</text><path d="M640,496 C640,545 1245,545 1245,498" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="940" y="562" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="middle" fill="#6b7280">stop failed</text><rect x="50" y="440" width="170" height="56" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="135.0" y="464" font-family="monospace" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">CANCELLED</text><text x="135.0" y="484" font-family="monospace" font-size="11" text-anchor="middle" fill="#6b7280">CMP: CANCELLED</text><line x1="135" y1="306" x2="135" y2="440" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="145" y="350" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#6b7280">cancelled before start</text><rect x="1140" y="100" width="210" height="190" rx="4" fill="#ffffff" stroke="#4b5563" stroke-width="1"/><text x="1152" y="122" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">Notes for CMP</text><text x="1152" y="144" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#1f2937">• ABORT_FAILED: no CMP status</text><text x="1152" y="162" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#1f2937">• ABORTING maps to RUNNING</text><text x="1152" y="180" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#1f2937">  because the job is not finished</text><text x="1152" y="198" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#1f2937">• READY is merged with PENDING</text><text x="1152" y="216" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#1f2937">• retry: the target state</text><text x="1152" y="234" font-family="Loma, 'Noto Sans Thai', sans-serif" font-size="11" text-anchor="start" fill="#1f2937">  is not stated, so no arrow</text></svg>
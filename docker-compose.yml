name: cmp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-cmp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Simulated Huawei OceanStor Dorado V7 (port 8088)
  mock-dorado:
    build: ./mock-server
    environment:
      MOCK_PROFILE: dorado
      MOCK_USERNAME: ${MOCK_USERNAME:-admin}
      MOCK_PASSWORD: ${MOCK_PASSWORD:-Admin@storage1}
    ports:
      - "8088:8088"

  # Simulated Huawei OceanProtect (port 8089)
  mock-oceanprotect:
    build: ./mock-server
    environment:
      MOCK_PROFILE: oceanprotect
      MOCK_USERNAME: ${MOCK_USERNAME:-admin}
      MOCK_PASSWORD: ${MOCK_PASSWORD:-Admin@storage1}
      MOCK_PORT: "8089"
    ports:
      - "8089:8089"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: ["arq", "app.worker.settings.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
